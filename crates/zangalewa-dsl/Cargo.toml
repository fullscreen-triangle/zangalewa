[package]
name = "zangalewa-dsl"
version = "0.1.0"
edition = "2021"
description = "Zangalewa: (dslId, instructions) -> DSL chunks that compile. The OS's only AI module."
license = "MIT"

# Its own workspace root, deliberately. The repository root package declares
# path dependencies on crates/ai-integration, crates/domain-bridge and three
# others that contain no source files and whose manifests declare no targets.
# Cargo resolves those paths for ANY package in the same workspace, so being a
# member there makes this crate unbuildable for reasons that have nothing to
# do with it. Detaching costs a separate target/ directory and buys the
# ability to compile and test at all.
#
# Fold this back into the root workspace once those crates either gain a
# src/lib.rs or are removed.
[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
